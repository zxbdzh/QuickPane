<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/quickpane-mark.svg" />
    <title>QuickPane</title>
    <script>
      // 在首帧渲染前应用主题，避免明暗切换闪白。
      (function () {
        try {
          var preference = localStorage.getItem("quickpane.theme") || "system";
          var dark =
            preference === "dark" ||
            (preference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (error) {
          /* localStorage 不可用时回退到亮色 */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
