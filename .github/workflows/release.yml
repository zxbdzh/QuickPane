name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: 10

jobs:
  build:
    runs-on: windows-latest
    # secrets 上下文不能出现在步骤级 if 里，先统一映射到 job 环境变量再判断。
    env:
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_PUBLIC_BASE_URL: ${{ secrets.MINIO_PUBLIC_BASE_URL }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.MINIO_REGION || 'us-east-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # MinIO 配置齐全时作为首选更新源，GitHub Release 始终作为兜底。
      # 真实 MinIO 地址只存在于 Secrets 和运行时生成的覆盖文件中，不进仓库。
      - name: Prepare updater endpoints
        shell: pwsh
        run: |
          $endpoints = @()
          if ($env:MINIO_ENDPOINT -and $env:MINIO_PUBLIC_BASE_URL) {
            $endpoints += ("{0}/latest.json" -f $env:MINIO_PUBLIC_BASE_URL.TrimEnd('/'))
          }
          $endpoints += "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          $config = @{ plugins = @{ updater = @{ endpoints = $endpoints } } }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 updater-overrides.json
          Get-Content updater-overrides.json

      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: QuickPane ${{ github.ref_name }}
          releaseBody: Automated release for ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: --config updater-overrides.json

      - name: Generate and upload GitHub updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS updater installer was not generated" }
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path $signaturePath)) { throw "Updater signature was not generated" }
          $version = "${{ github.ref_name }}".TrimStart("v")
          $env:UPDATE_VERSION = $version
          $env:UPDATE_SIGNATURE = (Get-Content $signaturePath -Raw).Trim()
          $env:UPDATE_URL = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($installer.Name)"
          node scripts/make-update-manifest.mjs
          gh release upload "${{ github.ref_name }}" latest.json --clobber

      - name: Sync updater files to MinIO
        if: ${{ env.MINIO_ENDPOINT != '' && env.MINIO_PUBLIC_BASE_URL != '' }}
        shell: pwsh
        run: |
          $endpoint = $env:MINIO_ENDPOINT.TrimEnd('/')
          $bucket = $env:MINIO_BUCKET
          if (-not $bucket) { $bucket = "quickpane-releases" }
          $publicBase = $env:MINIO_PUBLIC_BASE_URL.TrimEnd('/')
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS updater installer was not generated" }
          $signaturePath = "$($installer.FullName).sig"
          aws configure set default.s3.addressing_style path

          # MinIO 偶发 SSL EOF（反代/TLS 抖动），上传失败必须让步骤失败并重试。
          function Upload($src, $dst, $ct) {
            for ($i = 1; $i -le 3; $i++) {
              aws s3 cp $src $dst --endpoint-url $endpoint --content-type $ct
              if ($LASTEXITCODE -eq 0) { return }
              Write-Host "upload attempt $i failed: $dst"
              Start-Sleep -Seconds (5 * $i)
            }
            throw "upload failed after 3 attempts: $dst"
          }

          Upload $installer.FullName "s3://$bucket/$($installer.Name)" application/octet-stream
          Upload $signaturePath "s3://$bucket/$($installer.Name).sig" text/plain
          $version = "${{ github.ref_name }}".TrimStart("v")
          $env:UPDATE_VERSION = $version
          $env:UPDATE_SIGNATURE = (Get-Content $signaturePath -Raw).Trim()
          $env:UPDATE_URL = "$publicBase/$($installer.Name)"
          node scripts/make-update-manifest.mjs
          Upload latest.json "s3://$bucket/latest.json" application/json
