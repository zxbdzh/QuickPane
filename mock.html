<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickPane UI Mock</title>
    <script>
      // 与 index.html 相同的主题引导，避免截图首帧闪白；支持 ?theme= 覆盖。
      (function () {
        try {
          var override = new URLSearchParams(window.location.search).get("theme");
          if (override === "light" || override === "dark") {
            localStorage.setItem("quickpane.theme", override);
          }
          var preference = localStorage.getItem("quickpane.theme") || "system";
          var dark =
            preference === "dark" ||
            (preference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (error) {
          /* ignore */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/mock/main.tsx"></script>
  </body>
</html>
